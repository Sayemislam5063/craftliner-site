<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Sharee Craftline</title>

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <nav class="nav">
      <a href="index.html" class="brand">
        <div class="logo-balloon-wrapper">
          <img src="assets/logo.png" alt="Sharee Craftline" class="balloon-logo">
        </div>

        <div class="brand-name">
          Sharee Craftline
          <span>ন্যায্য দামে সঠিক পণ্য</span>
        </div>
      </a>

      <div class="nav-right">
        <div class="cart-icon-btn" id="cartBtn">
          🛒 <span class="cart-count" id="cartBadge">0</span>

          <div class="cart-panel" id="cartPanel">
            <div class="cart-panel-head">
              <h3>আমার কার্ট</h3>
              <button id="closeCartBtn" type="button">&times;</button>
            </div>

            <div class="cart-items" id="cartItems"></div>

            <div class="cart-empty" id="cartEmpty">
              আপনার কার্ট এখনো খালি।
            </div>

            <div class="cart-footer" id="cartFooter">
              <div class="cart-total">
                <span>মোট</span>
                <strong id="cartTotal">৳0</strong>
              </div>

              <button class="btn btn-solid" id="cartCheckoutBtn" type="button">
                Checkout
              </button>
            </div>
          </div>
        </div>
      </div>
    </nav>
  </header>

        <a href="index.html">Collection</a>

      </div>
    </nav>
  </header>


  <main class="product-page">

    <div id="productLoading">
      প্রোডাক্ট লোড হচ্ছে...
    </div>

    <div id="productDetails" style="display:none;">

      <div class="product-detail-layout">

  <div class="product-gallery">
    <div class="product-main-image">
      <img id="productMainImage" src="assets/logo.png" alt="">
    </div>

    <div class="product-thumbnails" id="productThumbnails"></div>
  </div>

  <div class="product-info">

    <div class="product-category" id="productCategory"></div>

    <h1 id="productTitle"></h1>

    <div class="product-stock" id="productStock"></div>

    <div class="product-price" id="productPrice"></div>

    <div class="product-options" id="productOptions"></div>

    <div class="product-actions">

      <div class="quantity-control">
        <button type="button" id="qtyMinus">−</button>
        <span id="productQty">1</span>
        <button type="button" id="qtyPlus">+</button>
      </div>

      <button type="button" class="product-add-cart" id="productAddCart">
        Add To Cart
      </button>

    </div>

    <button type="button" class="product-buy-now" id="productBuyNow">
      Buy Now
    </button>

  </div>

</div>

<div class="product-description-section">

  <div class="description-tabs">
    <button class="description-tab active" type="button">
      Description
    </button>

    <button class="description-tab" type="button">
      Additional information
    </button>
  </div>

  <div class="product-description" id="productDescription"></div>

</div>

    </div>

    <div id="productError" style="display:none;">
      প্রোডাক্ট পাওয়া যায়নি।
    </div>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="product.js"></script>

</body>
</html>
