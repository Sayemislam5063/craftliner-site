<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | Sharee Craftline</title>

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="style.css">

  <header>
