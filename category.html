<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Category | Sharee Craftline</title>

  <link rel="icon" href="assets/logo (2).png">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ================= HEADER ================= -->

<div id="shared-header"></div>

  <!-- ================= CATEGORY PAGE ================= -->

<main class="category-page">

  <!-- ১. ওপরে বাবল স্লাইডারের জন্য আলাদা ফ্রেম/কার্ড -->
  <div class="category-bubbles-card">
    <div class="category-bubbles-container">
      <div class="category-bubbles-scroll" id="categoryBubblesScroll">
        <!-- JavaScript থেকে dynamically বাবলগুলো আসবে -->
      </div>
    </div>
  </div>

  <!-- ২. আলাদা ব্যানার কার্ড (মাঝখানে কার্ভড স্কয়ার বক্সে অফ-হোয়াইট নাম) -->
  <section class="category-hero-banner-card" id="categoryHeroBanner">
    <div class="category-title-badge">
      <h1 id="categoryTitle">ক্যাটাগরি</h1>
    </div>
  </section>

  <!-- ৩. পর্যাপ্ত স্পেস সহ প্রোডাক্ট গ্রিড -->
  <section class="category-products-page-grid" id="categoryProductsGrid">
    <div class="empty-state">
      প্রোডাক্ট লোড হচ্ছে...
    </div>
  </section>

</main>

<div id="shared-bottom-nav"></div>

<script>
  fetch('bottom-nav.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('shared-bottom-nav').innerHTML = data;
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
  fetch('header.html')
    .then(response => response.text())
    .then(data => {
      document.getElementById('shared-header').innerHTML = data;

      const categoryScript = document.createElement('script');
      categoryScript.src = 'category.js';
      document.body.appendChild(categoryScript);
    });
</script>

</body>
</html>
