<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Sharee Craftline</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body">

<!-- Login Screen -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>Admin Panel</h2>
    <p>Sharee Craftline প্রোডাক্ট ম্যানেজমেন্ট</p>
    <div class="field">
      <label>ইমেইল</label>
      <input type="email" id="loginEmail" placeholder="you@example.com">
    </div>
    <div class="field">
      <label>পাসওয়ার্ড</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <div class="admin-error" id="loginError">ইমেইল বা পাসওয়ার্ড সঠিক নয়</div>
    <button class="btn btn-solid" id="loginBtn">লগইন করুন</button>
  </div>
</div>

<!-- Admin Panel (hidden until logged in) -->
<div id="adminPanel" style="display:none;">
  <header class="admin-header">
    <div class="brand-name">Sharee Craftline<span>ADMIN PANEL</span></div>
    <button class="logout-btn" id="logoutBtn">লগআউট</button>
  </header>

  <div class="admin-wrap">

    <div class="admin-card">
      <h3 id="formTitle">নতুন প্রোডাক্ট যোগ করুন</h3>
      <input type="hidden" id="editId">
      <div class="form-grid">
        <div class="field full">
          <label>প্রোডাক্টের নাম</label>
          <input type="text" id="pName" placeholder="যেমন: জামদানি শাড়ি - রয়েল ব্লু">
        </div>
        <div class="field">
          <label>দাম (টাকা)</label>
          <input type="number" id="pPrice" placeholder="যেমন: 3500">
        </div>
        <div class="field full">
          <label>প্রোডাক্টের ছবি</label>
          <div class="image-dropzone" id="imageDropzone">
            <img id="imagePreview" style="display:none;">
            <div class="dropzone-text" id="dropzoneText">ছবি এখানে ড্র্যাগ করে ছাড়ুন, অথবা ক্লিক করে বেছে নিন</div>
            <input type="file" id="imageFileInput" accept="image/*" hidden>
          </div>
          <input type="text" id="pImage" placeholder="অথবা সরাসরি ছবির লিংক দিন (https://...)" style="margin-top:10px;">
          <div class="admin-error" id="imageError">ছবি আপলোড করা যায়নি। আবার চেষ্টা করুন।</div>
        </div>
        <div class="field full">
          <label>বিবরণ</label>
          <textarea id="pDesc" rows="2" placeholder="সংক্ষিপ্ত বিবরণ লিখুন"></textarea>
        </div>
        <div class="checkbox-field">
          <input type="checkbox" id="pPromoAllowed" checked>
          <label for="pPromoAllowed">এই প্রোডাক্টে প্রোমো কোড ব্যবহারের অনুমতি দিন</label>
        </div>
      </div>
      <div class="admin-error" id="formError">নাম ও দাম দেওয়া আবশ্যক</div>
      <div class="form-actions">
        <button class="btn btn-solid" id="saveBtn">প্রোডাক্ট সেভ করুন</button>
        <button class="btn-cancel" id="cancelEditBtn" style="display:none;">বাতিল করুন</button>
      </div>
    </div>

    <div class="admin-list-head">
      <h3>সব প্রোডাক্ট</h3>
    </div>
    <div id="productList">
      <div class="admin-empty">লোড হচ্ছে...</div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
