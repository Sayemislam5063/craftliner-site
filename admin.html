<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ক্রাফ্টলাইনার অ্যাডমিন</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div class="admin-wrapper">
    <!-- সাইডবার -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fas fa-crown"></i>
        <span>ক্রাফ্টলাইনার</span>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-tab="add-product">
          <i class="fas fa-plus-circle"></i> নতুন পণ্য
        </button>
        <button class="nav-btn" data-tab="manage-products">
          <i class="fas fa-list-ul"></i> সব পণ্য
        </button>
        <button class="nav-btn" data-tab="categories">
          <i class="fas fa-tags"></i> ক্যাটাগরি
        </button>
      </nav>
    </aside>

    <!-- কন্টেন্ট -->
    <main class="main-content">
      <!-- ট্যাব ১ -->
      <section id="tab-add-product" class="tab-panel active">
        <div class="page-header">
          <h1><i class="fas fa-upload"></i> নতুন পণ্য আপলোড</h1>
        </div>

        <form id="product-form" class="product-form">
          <div class="form-grid">
            <div class="form-group">
              <label>পণ্যের নাম *</label>
              <input type="text" id="product-name" placeholder="যেমন: নীল চাদর" required>
            </div>
            <div class="form-group">
              <label>ক্যাটাগরি *</label>
              <select id="product-category" required>
                <option value="">— নির্বাচন করুন —</option>
              </select>
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label>নিয়মিত দাম (৳) *</label>
              <input type="number" id="product-price" placeholder="যেমন: 1200" required>
            </div>
            <div class="form-group highlight">
              <label>অফার দাম (৳)</label>
              <input type="number" id="product-offer-price" placeholder="ঐচ্ছিক">
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label>ব্লাউজ সহ দাম (৳)</label>
              <input type="number" id="price-with-blouse" placeholder="ঐচ্ছিক">
            </div>
            <div class="form-group">
              <label>ব্লাউজ ছাড়া দাম (৳)</label>
              <input type="number" id="price-without-blouse" placeholder="ঐচ্ছিক">
            </div>
          </div>

          <div class="form-group">
            <label>রং (কমা দিয়ে আলাদা করুন)</label>
            <input type="text" id="product-colors" placeholder="যেমন: লাল, নীল, সোনালি">
          </div>

          <div class="form-group">
            <label>ছবি আপলোড করুন (একাধিক)</label>
            <div class="drop-zone" id="drop-zone">
              <i class="fas fa-cloud-upload-alt"></i>
              <p>এখানে ক্লিক বা ড্র্যাগ করুন</p>
              <span>PNG, JPG, WEBP (Max 5MB)</span>
              <input type="file" id="file-input" accept="image/*" multiple hidden>
            </div>
            <div class="preview-grid" id="preview-grid"></div>
          </div>

          <button type="submit" class="submit-btn">
            <i class="fas fa-save"></i> পণ্য সংরক্ষণ করুন
          </button>
        </form>
      </section>

      <!-- ট্যাব ২ -->
      <section id="tab-manage-products" class="tab-panel">
        <div class="page-header">
          <h1><i class="fas fa-boxes"></i> সব পণ্য</h1>
          <button id="refresh-products" class="btn-icon"><i class="fas fa-sync-alt"></i></button>
        </div>
        <div id="product-list" class="product-list"></div>
      </section>

      <!-- ট্যাব ৩ -->
      <section id="tab-categories" class="tab-panel">
        <div class="page-header">
          <h1><i class="fas fa-tags"></i> ক্যাটাগরি ব্যবস্থাপনা</h1>
        </div>
        <div class="category-manager">
          <div class="category-input-group">
            <input type="text" id="category-input" placeholder="নতুন ক্যাটাগরি নাম...">
            <button id="add-category-btn"><i class="fas fa-plus"></i> যোগ করুন</button>
          </div>
          <div id="category-list" class="category-chips"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
